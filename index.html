<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preny AI Demo</title>
<link rel="stylesheet" href="assets/fonts/fonts.css"><!-- phông tải sẵn về máy (tai-offline.py) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611130929">
</head>
<body>
<div id="stage">
  <!-- CỘT TRÁI: 6 tính năng -->
  <div id="left">
    <div class="brand reveal" id="brand"></div>
    <div class="collapse reveal" id="badgeWrap">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.2 7.3 7.3 2.2-7.3 2.2L12 21.5l-2.2-7.3L2.5 12l7.3-2.2z"/></svg>
        <span id="badgeText">AI CHATBOT CHỐT ĐƠN</span>
      </div>
    </div>
    <h1 class="reveal" id="h1"></h1>
    <div class="collapse reveal" id="subWrap"><div class="sub" id="sub"></div></div>
    <div class="cards" id="cards"></div>
  </div>

  <!-- BÊN PHẢI: điện thoại (chỉ hiện nửa trên) -->
  <div id="phone">
    <div class="screen" id="screen">
      <div class="island"></div>
      <div class="status">
        <span>10:30</span>
        <span class="sicons">
          <svg width="40" height="26" viewBox="0 0 20 13"><rect x="0" y="9" width="3.2" height="4" rx="1" fill="#111"/><rect x="5.4" y="6" width="3.2" height="7" rx="1" fill="#111"/><rect x="10.8" y="3" width="3.2" height="10" rx="1" fill="#111"/><rect x="16.2" y="0" width="3.2" height="13" rx="1" fill="#111"/></svg>
          <svg width="58" height="28" viewBox="0 0 29 14"><rect x="0.8" y="0.8" width="24" height="12.4" rx="3.6" fill="none" stroke="#111" stroke-opacity=".45" stroke-width="1.4"/><rect x="2.8" y="2.8" width="18" height="8.4" rx="2" fill="#111"/><rect x="26.2" y="4.6" width="2" height="4.8" rx="1" fill="#111" fill-opacity=".45"/></svg>
        </span>
      </div>
      <div class="head" id="head">
        <svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        <div class="avatar" id="avatar"></div>
        <div class="who">
          <div class="shop" id="shopName"></div>
          <div class="online" id="online"></div>
        </div>
        <div class="hicons" id="hicons">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6.6 3.5h2.6l1.6 4.4-2.1 1.4a11.5 11.5 0 0 0 5.9 5.9l1.4-2.1 4.4 1.6v2.6a2 2 0 0 1-2.1 2A16.5 16.5 0 0 1 4.6 5.6a2 2 0 0 1 2-2.1z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>
        </div>
      </div>
      <div class="chat" id="chat"><div class="inner" id="inner"></div></div>
    </div>
  </div>
</div>

<div id="hint">Nhấn <b>Space</b> hoặc bấm chuột để bắt đầu · <b>Space</b> tạm dừng / tiếp tục · <b>R</b> chạy lại</div>

<script src="assets/offline.js?v=202611130929"></script><!-- ảnh tải sẵn về máy (tai-offline.py); thiếu file thì dùng ảnh trên mạng -->
<script>
  // Mở link gốc của trang web (không có ?kb=…) → sang trang trình chiếu. Video, iframe demo luôn có ?kb= nên không bị ảnh hưởng.
  if (!location.search && location.protocol !== 'file:') location.replace('trinh-chieu.html' + location.hash);
  // Chọn kịch bản qua ?kb=ten-file (mặc định: thoi-trang)
  (function () {
    var kb = (new URLSearchParams(location.search).get('kb') || 'thoi-trang').replace(/[^a-z0-9-]/gi, '');
    var PRENY_V = '202611130929';   // mã phiên bản, đổi mỗi lần đẩy lên mạng
    document.write('<script src="kich-ban/' + kb + '.js?v=' + PRENY_V + '"><\/script>');
  })();
</script>
<script src="engine.js?v=202611130929"></script>
</body>
</html>
